<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - ProDo</title>
    <script>
        (function () {
            if (!location.hostname.endsWith('github.io')) return;
            const parts = location.pathname.split('/').filter(Boolean);
            if (parts.length === 0) return;
            const repo = parts[0];
            if (repo.includes('.')) return;
            const base = document.createElement('base');
            base.href = '/' + repo + '/';
            document.head.prepend(base);
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#6366f1', background: '#f8fafc', surface: '#ffffff' } } }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-background text-slate-800 font-sans antialiased min-h-screen flex items-center justify-center p-4" style="font-family: Inter, sans-serif">
    <main class="bg-surface w-full max-w-sm rounded-2xl shadow-xl border border-slate-200 p-6 md:p-8">
        <div class="text-center mb-7">
            <img src="assets/logo.png" alt="ProDo Logo" class="w-16 h-16 mx-auto rounded-2xl shadow-sm mb-4 border border-slate-100">
            <h1 class="text-2xl font-bold text-slate-800">Reset Password</h1>
            <p class="text-sm text-slate-500 mt-2">Masukkan email akun Anda. Kami akan mengirimkan tautan untuk membuat password baru.</p>
        </div>
        <form id="resetPasswordForm" class="flex flex-col gap-4">
            <div>
                <label for="resetEmail" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input type="email" id="resetEmail" autocomplete="email" required placeholder="nama@email.com"
                    class="w-full py-2.5 px-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary/50">
            </div>
            <p id="resetMessage" role="status" aria-live="polite" class="hidden text-sm rounded-lg p-3"></p>
            <button type="submit" id="resetSubmitBtn" class="w-full py-3 px-4 bg-primary text-white rounded-xl font-medium hover:bg-indigo-600 transition-colors">
                Kirim tautan reset
            </button>
        </form>
        <a href="index.html" class="block text-center text-sm text-primary font-medium hover:underline mt-6">Kembali ke halaman masuk</a>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js" id="firebaseConfigScript"></script>
    <script>
        const firebaseConfigScript = document.getElementById('firebaseConfigScript');
        firebaseConfigScript?.addEventListener('error', () => { window.__FIREBASE_CONFIG_MISSING__ = true; });

        const form = document.getElementById('resetPasswordForm');
        const emailInput = document.getElementById('resetEmail');
        const submitButton = document.getElementById('resetSubmitBtn');
        const message = document.getElementById('resetMessage');

        function showMessage(text, isError = false) {
            message.textContent = text;
            message.className = `text-sm rounded-lg p-3 ${isError ? 'bg-red-50 text-red-700' : 'bg-emerald-50 text-emerald-700'}`;
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const email = emailInput.value.trim();
            if (!email) return;

            submitButton.disabled = true;
            submitButton.textContent = 'Mengirim...';
            message.classList.add('hidden');

            try {
                if (window.__FIREBASE_CONFIG_MISSING__ || typeof FIREBASE_CONFIG === 'undefined'
                    || !FIREBASE_CONFIG.apiKey || String(FIREBASE_CONFIG.apiKey).includes('YOUR_')) {
                    throw new Error('Konfigurasi Firebase belum tersedia. Silakan hubungi pengelola aplikasi.');
                }
                if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
                await firebase.auth().sendPasswordResetEmail(email);
                showMessage('Jika email tersebut terdaftar, tautan reset password akan segera dikirim. Periksa juga folder spam.');
                form.reset();
            } catch (error) {
                console.error('[ProDo] Reset password gagal:', error);
                if (error.code === 'auth/invalid-email') {
                    showMessage('Format email tidak valid.', true);
                } else if (error.code === 'auth/operation-not-allowed') {
                    showMessage('Reset password belum aktif. Aktifkan metode Email/Password di Firebase Authentication.', true);
                } else if (error.message.includes('Konfigurasi Firebase')) {
                    showMessage(error.message, true);
                } else {
                    // Do not disclose whether an email address belongs to an account.
                    showMessage('Permintaan belum dapat diproses. Periksa koneksi dan coba lagi.');
                }
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Kirim tautan reset';
            }
        });
    </script>
</body>
</html>
